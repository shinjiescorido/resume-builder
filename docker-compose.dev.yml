services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json

  pdf-generator:
    build:
      context: ./pdf-generator
      dockerfile: Dockerfile
      target: dev
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./pdf-generator/src:/app/src
      - ./pdf-generator/package.json:/app/package.json
      - ./pdf-generator/tsconfig.json:/app/tsconfig.json
      - ./pdf-generator/nest-cli.json:/app/nest-cli.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
