services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
      PDF_SERVICE_URL: http://pdf-generator:4001
      PDF_WEBHOOK_SECRET: ${PDF_WEBHOOK_SECRET}
      PUBLIC_BACKEND_URL: http://backend:4000
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: /data/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    networks:
      - app

  pdf-generator:
    build:
      context: ./pdf-generator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      PDF_DIR: /data/pdfs
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "4001:4001"
    volumes:
      - pdfs:/data/pdfs
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3050:3000"
    networks:
      - app

volumes:
  mongo-data:
  uploads:
  pdfs:

networks:
  app:
    driver: bridge
